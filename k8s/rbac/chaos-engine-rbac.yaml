# k8s/rbac/chaos-engine-rbac.yaml
# RBAC for the chaos engine.
#
# Principle of least privilege:
# - The chaos engine needs to list and delete pods (for pod kill)
# - It needs to read PodDisruptionBudgets (to respect them)
# - It does NOT need cluster-admin
# - It is explicitly forbidden from touching system namespaces

apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-engine
  namespace: chaos-platform
  labels:
    app: chaos-engine

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-engine-role
  labels:
    app: chaos-engine
rules:
  # Pod operations — needed for pod kill
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]  # for tc/netem commands

  # Read pod logs for health checking
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # PodDisruptionBudget — read only (we NEVER modify these)
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]

  # Deployments and ReplicaSets — needed to understand pod ownership
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

  # Node operations — for node drain experiments
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]  # for tainting (simulating node failure)

  # Events — write experiment events to K8s for kubectl visibility
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-engine-binding
  labels:
    app: chaos-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-engine-role
subjects:
  - kind: ServiceAccount
    name: chaos-engine
    namespace: chaos-platform

---
# Deny all access to system namespaces using OPA/Gatekeeper constraint
# This is defense-in-depth: even if there's a bug in our blast radius code,
# the policy engine at the K8s level prevents system namespace targeting.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sBlockSystemNamespace
metadata:
  name: block-chaos-in-system-namespaces
spec:
  match:
    # Match pod delete requests from the chaos engine service account
    subjects:
      - name: chaos-engine
        kind: ServiceAccount
        namespace: chaos-platform
  parameters:
    blockedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - chaos-platform  # Chaos engine doesn't chaos itself

---
# k8s/daemonsets/network-chaos-agent.yaml
# The network chaos agent runs on every node with NET_ADMIN capability.
# It accepts gRPC commands from the chaos engine to apply/remove tc rules.
#
# Security considerations:
# - This container is privileged for the network namespace only
# - It runs with a dedicated service account with no cluster permissions
# - It only accepts commands from within the cluster (no external exposure)
# - All commands are logged for audit

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-chaos-agent
  namespace: chaos-platform
  labels:
    app: network-chaos-agent
spec:
  selector:
    matchLabels:
      app: network-chaos-agent
  template:
    metadata:
      labels:
        app: network-chaos-agent
      annotations:
        # Exclude this DaemonSet from being targeted by chaos
        "chaos.io/exclude": "true"
    spec:
      serviceAccountName: network-chaos-agent
      hostNetwork: true  # Required for tc on host network interfaces
      hostPID: true      # Required to enter pod network namespaces
      tolerations:
        # Run on all nodes including those with taints
        - operator: "Exists"
          effect: "NoSchedule"
        - operator: "Exists"
          effect: "NoExecute"
      containers:
        - name: agent
          image: ghcr.io/your-org/chaos-network-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7070
              name: grpc
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chaos-secrets
                  key: redis-url
          securityContext:
            capabilities:
              add:
                - NET_ADMIN  # Required for tc/netem
                - SYS_PTRACE # Required to enter pod network namespaces
            privileged: false  # We use capabilities, not full privilege
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
          livenessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: proc
          hostPath:
            path: /proc

---
# k8s/deployments/control-plane.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-control-plane
  namespace: chaos-platform
  labels:
    app: chaos-control-plane
spec:
  replicas: 2  # HA — the control plane itself must be resilient
  selector:
    matchLabels:
      app: chaos-control-plane
  template:
    metadata:
      labels:
        app: chaos-control-plane
      annotations:
        "chaos.io/exclude": "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chaos-control-plane
      containers:
        - name: control-plane
          image: ghcr.io/your-org/chaos-control-plane:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chaos-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chaos-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chaos-secrets
                  key: jwt-secret
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: chaos-config
                  key: nats-url
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: chaos-config
                  key: prometheus-url
            - name: MAX_BLAST_RADIUS_PCT
              valueFrom:
                configMapKeyRef:
                  name: chaos-config
                  key: max-blast-radius-pct
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      affinity:
        # Spread replicas across zones
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: chaos-control-plane

---
# PodDisruptionBudget for the control plane itself
# Irony: the chaos platform protects itself from chaos
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chaos-control-plane-pdb
  namespace: chaos-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chaos-control-plane
